<script>

// ============================================================
// SOUND ENGINE — Web Audio API, no external files needed
// ============================================================
const SFX = (() => {
  let ctx = null;
  let muted = false;

  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, type, vol, attack, decay, duration) {
    try {
      const c = getCtx();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.connect(gain);
      gain.connect(c.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, c.currentTime);
      gain.gain.setValueAtTime(0, c.currentTime);
      gain.gain.linearRampToValueAtTime(vol, c.currentTime + attack);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + attack + decay);
      osc.start(c.currentTime);
      osc.stop(c.currentTime + duration);
    } catch(e) {}
  }

  function chord(freqs, type, vol, duration) {
    freqs.forEach((f, i) => tone(f, type, vol, 0.01, duration - 0.01, duration));
  }

  function noise(vol, duration) {
    try {
      const c = getCtx();
      const buf = c.createBuffer(1, c.sampleRate * duration, c.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource();
      src.buffer = buf;
      const gain = c.createGain();
      src.connect(gain);
      gain.connect(c.destination);
      gain.gain.setValueAtTime(vol, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      src.start();
      src.stop(c.currentTime + duration);
    } catch(e) {}
  }

  function sweep(startFreq, endFreq, type, vol, duration) {
    try {
      const c = getCtx();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.connect(gain);
      gain.connect(c.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(startFreq, c.currentTime);
      osc.frequency.exponentialRampToValueAtTime(endFreq, c.currentTime + duration);
      gain.gain.setValueAtTime(vol, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      osc.start(c.currentTime);
      osc.stop(c.currentTime + duration);
    } catch(e) {}
  }

  return {
    toggle() { muted = !muted; return muted; },
    isMuted() { return muted; },

    // Tile selected — soft click
    select() {
      if (muted) return;
      tone(440, 'sine', 0.15, 0.005, 0.08, 0.09);
    },

    // Invalid swap — low thud
    invalid() {
      if (muted) return;
      tone(120, 'sawtooth', 0.2, 0.005, 0.15, 0.16);
      setTimeout(() => tone(100, 'sawtooth', 0.15, 0.005, 0.12, 0.13), 80);
    },

    // Match 3 — cheerful rising arpeggio
    match3() {
      if (muted) return;
      const notes = [523, 659, 784]; // C5 E5 G5
      notes.forEach((f, i) => setTimeout(() => tone(f, 'triangle', 0.25, 0.01, 0.18, 0.2), i * 60));
    },

    // Match 4 — bigger arpeggio + shimmer
    match4() {
      if (muted) return;
      const notes = [523, 659, 784, 1047];
      notes.forEach((f, i) => setTimeout(() => tone(f, 'triangle', 0.28, 0.01, 0.2, 0.22), i * 55));
      setTimeout(() => tone(2000, 'sine', 0.08, 0.01, 0.3, 0.32), 200);
    },

    // Match 5+ — fanfare
    match5() {
      if (muted) return;
      const notes = [523, 659, 784, 1047, 1319];
      notes.forEach((f, i) => setTimeout(() => tone(f, 'triangle', 0.3, 0.01, 0.25, 0.28), i * 50));
      setTimeout(() => chord([1047, 1319, 1568], 'sine', 0.12, 0.4), 300);
    },

    // Cascade / chain reaction — bubbly ascending sweep
    cascade() {
      if (muted) return;
      sweep(300, 900, 'sine', 0.18, 0.25);
      setTimeout(() => sweep(400, 1100, 'sine', 0.14, 0.2), 100);
    },

    // Tile fall — soft whoosh
    fall() {
      if (muted) return;
      sweep(800, 300, 'sine', 0.08, 0.15);
    },

    // Bomb power-up — deep boom
    bomb() {
      if (muted) return;
      tone(80, 'sawtooth', 0.35, 0.005, 0.4, 0.42);
      noise(0.25, 0.3);
      setTimeout(() => tone(60, 'sawtooth', 0.2, 0.005, 0.3, 0.32), 80);
    },

    // Volcano power-up — rumble + eruption sweep
    volcano() {
      if (muted) return;
      noise(0.2, 0.4);
      sweep(150, 600, 'sawtooth', 0.2, 0.5);
      setTimeout(() => sweep(600, 1200, 'sine', 0.15, 0.3), 250);
    },

    // Quake power-up — electric zap
    quake() {
      if (muted) return;
      sweep(200, 2000, 'sawtooth', 0.2, 0.15);
      setTimeout(() => sweep(2000, 400, 'sawtooth', 0.15, 0.2), 150);
      setTimeout(() => tone(1000, 'square', 0.1, 0.005, 0.15, 0.16), 300);
    },

    // Hint — gentle chime
    hint() {
      if (muted) return;
      tone(880, 'sine', 0.15, 0.01, 0.3, 0.32);
      setTimeout(() => tone(1100, 'sine', 0.1, 0.01, 0.25, 0.27), 150);
    },

    // Shuffle — whoosh sweep
    shuffle() {
      if (muted) return;
      sweep(200, 800, 'sine', 0.15, 0.3);
      setTimeout(() => sweep(800, 400, 'sine', 0.1, 0.2), 200);
    },

    // Level win — triumphant fanfare
    win() {
      if (muted) return;
      const melody = [523, 523, 659, 523, 784, 740];
      const times  = [0, 150, 300, 500, 650, 900];
      melody.forEach((f, i) => setTimeout(() => tone(f, 'triangle', 0.3, 0.01, 0.25, 0.28), times[i]));
      setTimeout(() => chord([523, 659, 784], 'triangle', 0.2, 0.6), 1000);
    },

    // Game over — descending sad tones
    lose() {
      if (muted) return;
      const notes = [523, 466, 415, 370];
      notes.forEach((f, i) => setTimeout(() => tone(f, 'triangle', 0.2, 0.01, 0.3, 0.35), i * 200));
    },

    // Dino unlock — sparkle flourish
    unlock() {
      if (muted) return;
      [784, 988, 1175, 1568].forEach((f, i) =>
        setTimeout(() => tone(f, 'sine', 0.2, 0.01, 0.2, 0.22), i * 80));
      setTimeout(() => chord([1047, 1319, 1568], 'sine', 0.15, 0.5), 400);
    },

    // Button click — soft tick
    click() {
      if (muted) return;
      tone(600, 'sine', 0.1, 0.005, 0.05, 0.06);
    },
  };
})();

// ============================================================
// PARTICLE SYSTEM — sparkle burst when tiles clear
// ============================================================
const PARTICLES = (() => {
  let canvas, ctx;

  function init() {
    if (canvas) return;
    canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
    document.body.appendChild(canvas);
    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(loop);
  }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx = canvas.getContext('2d');
  }

  const particles = [];

  const COLORS = [
    '#ffd166','#ffa500','#ff6b6b','#52b788',
    '#a8dadc','#ffffff','#ffec99','#95d5b2'
  ];

  function burst(x, y, count, matchSize) {
    const n = count || 12;
    const speed = 2 + matchSize * 0.4;
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.5;
      const v = speed * (0.5 + Math.random());
      const size = 3 + Math.random() * 4;
      const type = Math.random() < 0.5 ? 'circle' : 'star';
      particles.push({
        x, y,
        vx: Math.cos(angle) * v,
        vy: Math.sin(angle) * v - 1.5,
        alpha: 1,
        decay: 0.022 + Math.random() * 0.018,
        size,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        type,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.2,
        gravity: 0.12,
      });
    }
  }

  function drawStar(ctx, x, y, size, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * Math.PI * 4) / 5 - Math.PI / 2;
      const b = a + Math.PI * 2 / 5;
      ctx.lineTo(Math.cos(a) * size, Math.sin(a) * size);
      ctx.lineTo(Math.cos(b) * size * 0.4, Math.sin(b) * size * 0.4);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function loop() {
    requestAnimationFrame(loop);
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.98;
      p.alpha -= p.decay;
      p.rot += p.rotV;
      if (p.alpha <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      if (p.type === 'circle') {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else {
        drawStar(ctx, p.x, p.y, p.size, p.rot);
      }
    }
    ctx.globalAlpha = 1;
  }

  return {
    init,
    burstAt(el, matchSize) {
      if (!el) return;
      init();
      const rect = el.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      const count = Math.min(6 + matchSize * 2, 20);
      burst(x, y, count, matchSize || 3);
    }
  };
})();

const DINO_STORY = {"plato_plateosaurus": {"fact": "Plato lived 216\u2013199 million years ago in the Triassic Period, making him one of the very first dinosaurs ever! His name means \"flat lizard.\"", "moral": "Plato learns that growing up means saying \"no\" to secrets and \"yes\" to following the rules.", "storyTitle": "Plato's Secret Trouble", "teaser": "Plato gets pulled into a risky secret adventure by a friend \u2014 and discovers why rules are there to keep him safe."}, "shorty_coelophysis": {"fact": "Shorty was a Coelophysis, a fast theropod that walked on two legs like a long-legged bird. A real Coelophysis skull even flew to space on the MIR Space Station in 1998!", "moral": "Shorty learns that he matters, even on his unluckiest days.", "storyTitle": "Shorty's Lucky Star", "teaser": "Convinced bad luck follows him everywhere, Shorty runs away \u2014 and finds out just how loved he really is."}, "babs_barosaurus": {"fact": "Benny is a Diplodocus, one of the longest dinosaurs ever! His name means \u201cdouble-beamed\u201d because of two long bones under his tail.", "moral": "Benny learns that trying new things \u2014 even when they flop \u2014 is how you get better.", "storyTitle": "Benny's Snappy Comeback", "teaser": "Benny's new games keep going wrong, but he refuses to give up \u2014 and discovers what makes a game truly fun."}, "salty_stegosaurus": {"fact": "Salty is a Stegosaurus, an armored \"roofed lizard\" that lived in big herds during the Jurassic Period.", "moral": "Salty learns that stretching the truth can backfire \u2014 but real friends still have your back.", "storyTitle": "Salty's Fish Tale", "teaser": "Salty loves a good prank, so when real danger shows up, nobody believes him \u2014 at first."}, "iggy_iguanodon": {"fact": "Ziggy is an Iguanodon, one of the very first dinosaurs ever named! Its name means \"iguana tooth.\"", "moral": "Ziggy learns that the best adventures are the ones you stumble into.", "storyTitle": "Ziggy's Running Gag", "teaser": "Bored of being \"just\" an iguanodon, Ziggy goes looking for excitement \u2014 and finds something he truly loves."}, "peppy_parasaurolophus": {"fact": "Peppy is a Parasaurolophus, known for its big curvy head crest. Its name means \"near crested lizard.\"", "moral": "Peppy learns that quiet and loud both have the right time and place.", "storyTitle": "Peppy Makes a Ruckus", "teaser": "Peppy's noisiness attracts a hungry T-rex to his herd's valley \u2014 can he fix the mess he made?"}, "tootles_triceratops": {"fact": "Tootles is a Triceratops, with a parrot-like beak and a three-foot frill. Her name means \"three-horned face.\"", "moral": "Tootles learns that caring about others is more important than looking good.", "storyTitle": "Tootles and Olly", "teaser": "Tootles gets stuck in the forest by her own giant horn \u2014 and it takes a brand-new friend to help her see what really matters."}, "skippy_spinosaurus": {"fact": "Skippy is a Spinosaurus, the largest meat-eating dinosaur ever known \u2014 even bigger than T-rex! Its name means \"spine lizard.\"", "moral": "Skippy learns that being creative and never giving up helps you grow.", "storyTitle": "Skippy's Food Fight", "teaser": "Skippy hates fish, so he tries eating plants instead \u2014 but it doesn't go quite as planned."}, "victor_velociraptor": {"fact": "Victor is a Velociraptor \u2014 about the size of a turkey, with a long tail, found in the Gobi Desert. His name means \"swift robber.\"", "moral": "Victor learns that facing your fears gives you more strength than running from them.", "storyTitle": "Sleepless in the Cretaceous", "teaser": "Victor's nightmares keep him from sleeping \u2014 until he learns that facing fear head-on changes everything."}, "gigi_giganotosaurus": {"fact": "Gigi is a Giganotosaurus, the longest meat-eating dinosaur ever discovered! Found in Argentina, her name means \"giant southern reptile.\"", "moral": "Gigi learns she can follow her heart without leaving the people   try { localStorage.setItem('dks3m_scores_v3', JSON.stringify(scores)); } catch(e) {}
}
function clearScores() {
  scores = {};
  try { localStorage.removeItem('dks3m_scores_v3'); } catch(e) {}
  renderTitle();
}
function recordScore(lvl, sc, stars) {
  const prev = scores[lvl] || { score:0, stars:0 };
  scores[lvl] = { score: Math.max(prev.score, sc), stars: Math.max(prev.stars, stars) };
  saveScores();
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() {
  SFX.click();
  if (pendingUnlocks.length > 0) { showNextUnlock(); return; }
  renderTitle(); showScreen('title-screen');
}
function getNextLevel() {
  for (let l of LEVELS) if (!scores[l.id]) return l.id;
  return LEVELS[LEVELS.length-1].id;
}
function nextLevel() {
  if (pendingUnlocks.length > 0) { showNextUnlock(); return; }
  const idx = LEVELS.findIndex(l => l.id === currentLevel.id);
  if (idx < LEVELS.length - 1) startLevel(LEVELS[idx+1].id);
  else goHome();
}
function showNextUnlock() {
  document.getElementById('overlay').style.display = 'none';
  const dinoIdx = pendingUnlocks.shift();
  const d = DINOS[dinoIdx];
  const story = DINO_STORY[d.key];
  document.getElementById('unlock-img').src = DINO_IMAGES[d.key];
  document.getElementById('unlock-name').textContent = d.full;
  document.getElementById('unlock-moral').textContent = story ? story.moral : '';
  document.getElementById('unlock-overlay').style.display = 'flex'; SFX.unlock();
}
function closeUnlock() {
  document.getElementById('unlock-overlay').style.display = 'none';
  if (pendingUnlocks.length > 0) { showNextUnlock(); return; }
  renderTitle(); showScreen('title-screen');
}
function showDexDetail(dinoIdx) {
  const d = DINOS[dinoIdx];
  const story = DINO_STORY[d.key];
  document.getElementById('dex-detail-img').src = DINO_IMAGES[d.key];
  document.getElementById('dex-detail-name').textContent = d.full;
  document.getElementById('dex-detail-period').textContent = d.period + ' Period';
  document.getElementById('dex-detail-fact').textContent = story ? story.fact : '';
  document.getElementById('dex-detail-moral').textContent = story ? story.moral : '';
  document.getElementById('dex-detail-storytitle').textContent = story ? story.storyTitle : '';
  document.getElementById('dex-detail-teaser').textContent = story ? story.teaser : '';
  document.getElementById('dex-detail-overlay').style.display = 'flex';
}
function toggleMute() {
  const muted = SFX.toggle();
  document.getElementById('mute-btn').textContent = muted ? '🔇' : '🔊';
}
function closeDexDetail() {
  document.getElementById('dex-detail-overlay').style.display = 'none';
}
function renderTitle() {
  loadScores();
  // On desktop, wrap left/right columns
  const isDesktop = window.innerWidth >= 700;
  const screen = document.getElementById('title-screen');
  const parade = document.getElementById('parade');
  parade.innerHTML = DINOS.map(d => `<img src="${DINO_IMAGES[d.key]}" title="${d.full}">`).join('');
  const lg = document.getElementById('level-grid');
  lg.innerHTML = '';
  LEVELS.forEach(lvl => {
    const s = scores[lvl.id];
    const unlocked = lvl.id === 1 || scores[lvl.id - 1];
    const stars = s ? s.stars : 0;
    const starStr = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
    const btn = document.createElement('div');
    btn.className = 'level-btn' + (unlocked ? '' : ' locked');
    btn.innerHTML = `<div class="lnum">L${lvl.id}</div>
      <div class="lgoal">${lvl.name}</div>
      <div class="lstar">${unlocked ? starStr : '🔒'}</div>
      ${s ? `<div class="lgoal" style="color:#ffd166">${s.score}</div>` : ''}`;
    if (unlocked) btn.onclick = () => startLevel(lvl.id);
    lg.appendChild(btn);
  });
  const dex = document.getElementById('dex-grid');
  dex.innerHTML = DINOS.map((d, i) => {
    const unlocked = isDinoUnlocked(i);
    if (unlocked) {
      return `<div class="dex-card unlocked" onclick="showDexDetail(${i})">
        <img src="${DINO_IMAGES[d.key]}">
        <div class="dex-name">${d.name}</div>
        <div class="dex-period">${d.period}</div>
      </div>`;
    } else {
      return `<div class="dex-card locked">
        <div class="dex-silhouette">❓</div>
        <div class="dex-name">???</div>
        <div class="dex-period">L${DINO_UNLOCK_LEVEL[i]} to unlock</div>
      </div>`;
    }
  }).join('');
  const lb = document.getElementById('lb-list');
  const allScores = Object.entries(scores)
    .map(([id, v]) => ({ level: LEVELS.find(l=>l.id==id)?.name || `Level ${id}`, score: v.score, stars: v.stars }))
    .sort((a,b) => b.score - a.score)
    .slice(0, 5);
  if (allScores.length === 0) {
    lb.innerHTML = '<div class="lb-empty">No scores yet — start playing!</div>';
  } else {
    lb.innerHTML = allScores.map((e,i) =>
      `<div class="lb-row">
        <div class="lb-rank">${['🥇','🥈','🥉','4','5'][i]}</div>
        <div class="lb-name">${e.level}</div>
        <div>${'⭐'.repeat(e.stars)}</div>
        <div class="lb-score">${e.score}</div>
      </div>`).join('');
  }
}
function startLevel(id) { SFX.click();
  currentLevel = LEVELS.find(l => l.id === id);
  GRID = currentLevel.grid;
  levelDinoSet = currentLevel.dinoSet;
  score = 0; moves = currentLevel.moves; busy = false; selected = null; hintCells = [];
  activePU = null; powerups = { bomb:2, meteor:1, fossil:1 };
  goalProgress = currentLevel.goals.map(g => ({ ...g, collected: 0 }));
  levelComplete = false;
  document.getElementById('period-banner').textContent = `⏳ ${currentLevel.period} Period — ${currentLevel.name}`;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('board').style.gridTemplateColumns = `repeat(${GRID}, 1fr)`;
  do { board = createBoard(); } while (!hasMoves());
  updateHUD(); renderGoals(); renderPowerups(); renderBoard();
  setMsg(`Level ${currentLevel.id}: ${currentLevel.name}!`);
  showScreen('game-screen');
}
function randDino() { return levelDinoSet[Math.floor(Math.random()*levelDinoSet.length)]; }
function createBoard() {
  let b = [];
  for (let r = 0; r < GRID; r++) {
    b[r] = [];
    for (let c = 0; c < GRID; c++) {
      let val;
      do { val = randDino(); }
      while (
        (c >= 2 && b[r][c-1] === val && b[r][c-2] === val) ||
        (r >= 2 && b[r-1]?.[c] === val && b[r-2]?.[c] === val)
      );
      b[r][c] = val;
    }
  }
  return b;
}
function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const v = board[r][c];
      const cell = document.createElement('div');
      cell.className = `cell`;
      cell.id = `cell-${r}-${c}`;
      cell.innerHTML = `<img src="${imgSrc(v)}" draggable="false">`;
      if (selected && selected[0]===r && selected[1]===c) cell.classList.add('selected');
      if (activePU) cell.style.cursor = 'crosshair';
      cell.addEventListener('click', () => onCellClick(r, c));
      boardEl.appendChild(cell);
    }
  }
}
function updateHUD() {
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-moves').textContent = moves;
}
function renderGoals() {
  const el = document.getElementById('goal-items');
  el.innerHTML = goalProgress.map(g => {
    const done = g.collected >= g.count;
    return `<div class="goal-item ${done?'done':''}">
      <img src="${imgSrc(g.dino)}">
      <span class="gi-count">${Math.min(g.collected,g.count)}/${g.count}</span>
      ${done ? '✅' : ''}
    </div>`;
  }).join('');
}
function renderPowerups() {
  document.getElementById('pu-bomb-count').textContent = powerups.bomb;
  document.getElementById('pu-meteor-count').textContent = powerups.meteor;
  document.getElementById('pu-fossil-count').textContent = powerups.fossil;
  ['bomb','meteor','fossil'].forEach(p => {
    document.getElementById(`pu-${p}-btn`).classList.toggle('active', activePU === p);
  });
}
function setMsg(m) { document.getElementById('msg-bar').textContent = m; }
function activatePowerup(type) {
  if (busy) return;
  if (powerups[type] <= 0) { setMsg(`No ${type}s left!`); return; }
  activePU = activePU === type ? null : type;
  renderPowerups();
  if (activePU === 'bomb')   setMsg('💣 Click a tile to EXPLODE it!');
  if (activePU === 'meteor') setMsg('🌋 Click to erupt an entire ROW!');
  if (activePU === 'fossil') setMsg('⚡ Click to clear all of that dino!');
  if (!activePU) setMsg('Powerup cancelled.');
}
function onCellClick(r, c) {
  if (busy) return;
  clearHint();
  if (activePU) {
    usePowerup(activePU, r, c);
    return;
  }
  if (!selected) { selected = [r, c]; renderBoard(); SFX.select(); return; }
  const [sr, sc] = selected;
  if (sr === r && sc === c) { selected = null; renderBoard(); return; }
  const dr = Math.abs(r-sr), dc = Math.abs(c-sc);
  if ((dr===1&&dc===0)||(dr===0&&dc===1)) { selected = null; renderBoard(); doSwap(sr,sc,r,c); }
  else { selected = [r,c]; renderBoard(); }
}
function usePowerup(type, r, c) {
  powerups[type]--;
  activePU = null;
  renderPowerups();
  busy = true;
  let toRemove = [];
  if (type === 'bomb') {
    for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) {
      const nr=r+dr, nc=c+dc;
      if (nr>=0&&nr<GRID&&nc>=0&&nc<GRID) toRemove.push([nr,nc]);
    }
    setMsg('💥 BOOM!'); SFX.bomb();
  } else if (type === 'meteor') {
    for (let col=0; col<GRID; col++) toRemove.push([r,col]);
    setMsg('🌋 Volcano Strike!'); SFX.volcano();
  } else if (type === 'fossil') {
    const target = board[r][c];
    for (let rr=0; rr<GRID; rr++) for (let cc=0; cc<GRID; cc++)
      if (board[rr][cc]===target) toRemove.push([rr,cc]);
    setMsg(`⚡ All ${DINOS[target].name}s cleared!`); SFX.quake();
  }
  animateAndRemove(toRemove);
}
function animateSwap(r1,c1,r2,c2, onDone) {
  const board = document.getElementById('board');
  const cellSize = board.querySelector('.cell').offsetWidth;
  const elA = document.getElementById(`cell-${r1}-${c1}`);
  const elB = document.getElementById(`cell-${r2}-${c2}`);
  if (!elA || !elB) { onDone(); return; }
  const dx = (c2-c1)*cellSize;
  const dy = (r2-r1)*cellSize;
  elA.style.setProperty('--slide-x', dx+'px');
  elA.style.setProperty('--slide-y', dy+'px');
  elB.style.setProperty('--slide-x', dx+'px');
  elB.style.setProperty('--slide-y', dy+'px');
  elA.classList.add('swap-a');
  elB.classList.add('swap-b');
  setTimeout(() => {
    elA.classList.remove('swap-a');
    elB.classList.remove('swap-b');
    onDone();
  }, 220);
}

function animatePeek(r1,c1,r2,c2, onDone) {
  const board = document.getElementById('board');
  const cellSize = board.querySelector('.cell').offsetWidth;
  const elA = document.getElementById(`cell-${r1}-${c1}`);
  const elB = document.getElementById(`cell-${r2}-${c2}`);
  if (!elA || !elB) { onDone(); return; }
  const dx = (c2-c1)*cellSize*0.35;
  const dy = (r2-r1)*cellSize*0.35;
  elA.style.setProperty('--peek-x', dx+'px');
  elA.style.setProperty('--peek-y', dy+'px');
  elB.style.setProperty('--peek-x', dx+'px');
  elB.style.setProperty('--peek-y', dy+'px');
  elA.classList.add('peek-a');
  elB.classList.add('peek-b');
  setTimeout(() => {
    elA.classList.remove('peek-a');
    elB.classList.remove('peek-b');
    onDone();
  }, 420);
}

function doSwap(r1,c1,r2,c2) {
  busy = true;
  // Check validity BEFORE animating so we know which animation to play
  swap(r1,c1,r2,c2);
  const matches = findMatches();
  if (!matches.length) {
    // Invalid — show peek/shake then snap back
    swap(r1,c1,r2,c2); // revert immediately (board data correct)
    renderBoard();
    animatePeek(r1,c1,r2,c2, () => {
      setMsg('No match! Try again 🦕');
      SFX.invalid();
      busy = false;
    });
    return;
  }
  // Valid — revert data, play slide animation, then commit
  swap(r1,c1,r2,c2); // revert so renderBoard shows pre-swap state for animation
  renderBoard();
  animateSwap(r1,c1,r2,c2, () => {
    swap(r1,c1,r2,c2); // now commit the swap
    moves--; updateHUD();
    processMatches(matches);
  });
}
function swap(r1,c1,r2,c2) { [board[r1][c1],board[r2][c2]]=[board[r2][c2],board[r1][c1]]; }
function findMatches() {
  const matched = new Set();
  for (let r=0;r<GRID;r++) for (let c=0;c<GRID-2;c++) {
    if (board[r][c]===board[r][c+1]&&board[r][c]===board[r][c+2]) {
      let len=3; while(c+len<GRID&&board[r][c]===board[r][c+len])len++;
      for(let i=0;i<len;i++) matched.add(`${r},${c+i}`);
    }
  }
  for (let c=0;c<GRID;c++) for (let r=0;r<GRID-2;r++) {
    if (board[r][c]===board[r+1][c]&&board[r][c]===board[r+2][c]) {
      let len=3; while(r+len<GRID&&board[r+len]?.[c]===board[r][c])len++;
      for(let i=0;i<len;i++) matched.add(`${r+i},${c}`);
    }
  }
  return [...matched].map(k=>k.split(',').map(Number));
}
function processMatches(matches) {
  renderBoard();
  // Blink-before-clear: use blink-matched class instead of matched
  matches.forEach(([r,c]) => {
    const el=document.getElementById(`cell-${r}-${c}`);
    if(el) { el.classList.add('blink-matched'); PARTICLES.burstAt(el, matches.length); }
  });
  const pts = matches.length * 50 + (matches.length > 4 ? (matches.length-4)*100 : 0);
  score += pts;
  if (matches.length >= 5) SFX.match5();
  else if (matches.length === 4) SFX.match4();
  else SFX.match3();
  matches.forEach(([r,c]) => {
    const v = board[r][c];
    goalProgress.forEach(g => { if(g.dino===v && g.collected<g.count) g.collected++; });
  });
  const sampleDino = DINOS[board[matches[0][0]][matches[0][1]]].name;
  const msgs = [
    `Roar! 🦖 +${pts}`, `${sampleDino} Smash! +${pts}`,
    `Prehistoric Combo! +${pts}`, `Jurassic! +${pts}`, `Dino Kids Smash! +${pts}`
  ];
  setMsg(msgs[Math.floor(Math.random()*msgs.length)]);
  updateHUD(); renderGoals();
  setTimeout(() => {
    matches.forEach(([r,c]) => board[r][c] = -1);
    gravity(); refill(); renderBoard(); addFallAnim();
    setTimeout(() => {
      const nm = findMatches();
      if (nm.length) { SFX.cascade(); processMatches(nm); return; }
      busy = false;
      checkWin();
      if (!levelComplete && moves <= 0) { showGameOver(); return; }
      if (!levelComplete && !hasMoves()) { setMsg('No moves! Shuffling 🔀'); shuffleBoard(); }
    }, 280);
  }, 380);
}
function animateAndRemove(cells) {
  renderBoard();
  cells.forEach(([r,c]) => {
    const el=document.getElementById(`cell-${r}-${c}`);
    if(el) { el.classList.add('matched'); PARTICLES.burstAt(el, 4); }
  });
  const pts = cells.length * 60;
  score += pts; updateHUD();
  cells.forEach(([r,c]) => {
    const v=board[r][c];
    goalProgress.forEach(g=>{ if(g.dino===v&&g.collected<g.count) g.collected++; });
  });
  renderGoals();
  setTimeout(() => {
    cells.forEach(([r,c]) => board[r][c]=-1);
    gravity(); refill(); renderBoard(); addFallAnim();
    setTimeout(() => {
      const nm=findMatches();
      if(nm.length){processMatches(nm);return;}
      busy=false;
      checkWin();
      if(!levelComplete&&moves<=0){showGameOver();return;}
      if(!levelComplete&&!hasMoves()){setMsg('No moves! Shuffling 🔀');shuffleBoard();}
    },280);
  },400);
}
function gravity() {
  for(let c=0;c<GRID;c++){
    let e=GRID-1;
    for(let r=GRID-1;r>=0;r--) if(board[r][c]!==-1){board[e][c]=board[r][c];if(e!==r)board[r][c]=-1;e--;}
    for(let r=e;r>=0;r--) board[r][c]=-1;
  }
}
function refill() {
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++) if(board[r][c]===-1) board[r][c]=randDino();
}
function addFallAnim() {
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    const el=document.getElementById(`cell-${r}-${c}`);
    if(el){el.classList.remove('matched','falling');void el.offsetWidth;el.classList.add('falling');setTimeout(()=>el.classList.remove('falling'),250); SFX.fall();}
  }
}
function hasMoves() {
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    if(c<GRID-1){swap(r,c,r,c+1);if(findMatches().length){swap(r,c,r,c+1);return true;}swap(r,c,r,c+1);}
    if(r<GRID-1){swap(r,c,r+1,c);if(findMatches().length){swap(r,c,r+1,c);return true;}swap(r,c,r+1,c);}
  }
  return false;
}
function showHint() {
  if(busy)return; clearHint();
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    const pairs=[[r,c,r,c+1],[r,c,r+1,c]];
    for(const [r1,c1,r2,c2] of pairs){
      if(r2>=GRID||c2>=GRID)continue;
      swap(r1,c1,r2,c2);
      if(findMatches().length){swap(r1,c1,r2,c2);hintCells=[[r1,c1],[r2,c2]];hintCells.forEach(([hr,hc])=>{const el=document.getElementById(`cell-${hr}-${hc}`);if(el)el.classList.add('hint-glow');});setMsg('Swap the glowing dinos! ✨'); SFX.hint(); return;}
      swap(r1,c1,r2,c2);
    }
  }
}
function clearHint(){hintCells.forEach(([r,c])=>{const el=document.getElementById(`cell-${r}-${c}`);if(el)el.classList.remove('hint-glow');});hintCells=[];}
function shuffleBoard() {
  if(busy)return;
  do{for(let r=0;r<GRID;r++) for(let c=GRID-1;c>0;c--){const j=Math.floor(Math.random()*(c+1));[board[r][c],board[r][j]]=[board[r][j],board[r][c]];}}
  while(!hasMoves());
  renderBoard(); setMsg('Board shuffled! 🔀'); SFX.shuffle();
}
function calcStars() {
  const allDone = goalProgress.every(g => g.collected >= g.count);
  if (!allDone) return 0;
  const movesLeft = moves;
  if (movesLeft >= Math.ceil(currentLevel.moves * 0.5)) return 3;
  if (movesLeft >= Math.ceil(currentLevel.moves * 0.2)) return 2;
  return 1;
}
function checkWin() {
  if (levelComplete) return;
  const allDone = goalProgress.every(g => g.collected >= g.count);
  if (!allDone) return;
  levelComplete = true;
  const stars = calcStars();
  const bonus = moves * 100;
  score += bonus;

  // Determine which dinos get newly unlocked by completing this level (before saving the score)
  const newlyUnlocked = Object.entries(DINO_UNLOCK_LEVEL)
    .filter(([dinoIdx, reqLevel]) => reqLevel === currentLevel.id && !scores[reqLevel])
    .map(([dinoIdx]) => parseInt(dinoIdx));

  recordScore(currentLevel.id, score, stars);
  pendingUnlocks = newlyUnlocked;
  updateHUD();
  const ov = document.getElementById('overlay');
  document.getElementById('overlay-dino-img').src = imgSrc(goalProgress[0].dino);
  document.getElementById('overlay-title').textContent = stars===3 ? '🎉 Perfect!' : stars===2 ? '🌟 Great Job!' : '✅ Level Clear!';
  document.getElementById('overlay-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  document.getElementById('overlay-sub').textContent = `Score: ${score}  |  +${bonus} move bonus!`;

  // Show a moral/lesson line from one of this level's real dino characters (skip egg/bone)
  const storyDinoGoal = goalProgress.find(g => g.dino < 12 && DINO_STORY[DINOS[g.dino].key]);
  const moralEl = document.getElementById('overlay-moral');
  if (storyDinoGoal) {
    const story = DINO_STORY[DINOS[storyDinoGoal.dino].key];
    moralEl.textContent = `"${story.moral}"`;
  } else {
    moralEl.textContent = '';
  }

  const nextIdx = LEVELS.findIndex(l=>l.id===currentLevel.id);
  document.getElementById('overlay-next-btn').style.display = nextIdx < LEVELS.length-1 ? '' : 'none';
  ov.style.display = 'flex'; SFX.win();
  // Big celebration burst from center of screen
  setTimeout(() => {
    PARTICLES.init();
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    for(let i=0;i<5;i++) setTimeout(()=>{
      const ox=(Math.random()-0.5)*200, oy=(Math.random()-0.5)*150;
      PARTICLES.burstAt({getBoundingClientRect:()=>({left:cx+ox-20,top:cy+oy-20,width:40,height:40})}, 8);
    }, i*120);
  }, 200);
}
function showGameOver() {
  levelComplete = true;
  recordScore(currentLevel.id, score, 0);
  const ov = document.getElementById('overlay');
  document.getElementById('overlay-dino-img').src = imgSrc(levelDinoSet[0]);
  document.getElementById('overlay-title').textContent = '😢 Out of Moves!';
  document.getElementById('overlay-stars').textContent = '☆☆☆';
  document.getElementById('overlay-sub').textContent = `Score: ${score} — Try again?`;
  document.getElementById('overlay-moral').textContent = '';
  document.getElementById('overlay-next-btn').style.display = 'none';
  ov.style.display = 'flex'; SFX.lose();
}
loadScores();
renderTitle();
</script>
